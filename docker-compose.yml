services:
  db:
    image: postgres:16
    container_name: idor-db
    environment:
      POSTGRES_USER: idor
      POSTGRES_PASSWORD: idorpass
      POSTGRES_DB: idor_testbed
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  nginx:
    image: nginx:1.27
    container_name: idor-nginx
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./logs/nginx:/var/log/nginx
    extra_hosts:
      - "host.docker.internal:host-gateway"

  apache:
    build: ./infra/apache
    container_name: idor-apache
    ports:
      - "8081:80"
    volumes:
      - ./logs/apache:/usr/local/apache2/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
